name: Deploy to Production

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: 139.162.157.31
  VPS_USER: deploy
  DOMAIN: riviera-marine.fueld.app
  BUN_VERSION: '1.3.10'

permissions:
  contents: read
  actions: read

jobs:
  inspect-run:
    name: Inspect tested artifacts
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_deploy: ${{ steps.inspect.outputs.should_deploy }}
    steps:
      - name: Determine deploy eligibility
        id: inspect
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy Eligibility"
              echo ""
              echo "- should_deploy: true"
              echo "- reason: manual workflow_dispatch"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          artifacts_json=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")

          artifact_names=$(printf '%s' "$artifacts_json" | jq -r '.artifacts[].name')
          printf 'Artifacts for run %s:\n%s\n' "$RUN_ID" "$artifact_names"

          has_api=false
          has_web=false
          has_meta=false

          if printf '%s\n' "$artifact_names" | grep -qx 'api-release'; then
            has_api=true
          fi
          if printf '%s\n' "$artifact_names" | grep -qx 'web-browser'; then
            has_web=true
          fi
          if printf '%s\n' "$artifact_names" | grep -qx 'build-info'; then
            has_meta=true
          fi

          should_deploy=false
          if [ "$has_api" = true ] && [ "$has_web" = true ] && [ "$has_meta" = true ]; then
            should_deploy=true
          fi

          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

          {
            echo "## Deploy Eligibility"
            echo ""
            echo "- api-release: $has_api"
            echo "- web-browser: $has_web"
            echo "- build-info: $has_meta"
            echo "- should_deploy: $should_deploy"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: inspect-run
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && needs.inspect-run.outputs.should_deploy == 'true' }}
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${DEPLOY_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Setup dependencies for manual deploys
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/setup-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: '22'

      - name: Download API binary artifact from Tests
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v5
        with:
          name: api-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: /tmp/deploy-artifacts/api

      - name: Restore API binary artifact
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          ls -lh /tmp/deploy-artifacts/api/api-release.gz

      - name: Download web build artifact from Tests
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v5
        with:
          name: web-browser
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: /tmp/deploy-artifacts/web

      - name: Restore web build artifact
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          mkdir -p apps/web/dist/web/browser
          cp -R /tmp/deploy-artifacts/web/. apps/web/dist/web/browser/

      - name: Download build metadata artifact from Tests
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v5
        with:
          name: build-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: /tmp/deploy-artifacts/meta

      - name: Restore build metadata artifact
        if: ${{ github.event_name == 'workflow_run' }}
        run: cp /tmp/deploy-artifacts/meta/build-info.json build-info.json

      - name: Generate build metadata
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          APP_VERSION=$(cat VERSION)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BRANCH_NAME=${GITHUB_REF_NAME:-main}
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DEPLOY_VERSION="${APP_VERSION}+deploy.${GITHUB_RUN_NUMBER}.sha.${SHORT_SHA}"
          APP_VERSION="$APP_VERSION" \
          GIT_SHA="$GITHUB_SHA" \
          GIT_BRANCH="$BRANCH_NAME" \
          BUILD_TIME="$BUILD_TIME" \
          DEPLOY_VERSION="$DEPLOY_VERSION" \
          GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER" \
          bun run build:meta

      # ─── Build API binary ─────────────────────────────────────────
      - name: Build API (standalone binary)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cd apps/api
          bun build src/index.ts --compile --minify --target=bun-linux-x64 --outfile app-release

      - name: Package API binary for upload
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          gzip -9 -c apps/api/app-release > /tmp/api-release.gz
          ls -lh apps/api/app-release /tmp/api-release.gz

      # ─── Build Frontend ────────────────────────────────────────────
      - name: Build Frontend
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cd apps/web
          bunx ng build --configuration production

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create staging directory on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "mkdir -p /opt/fueld/staging"

      - name: Upload API binary
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            API_BINARY_PATH=/tmp/deploy-artifacts/api/api-release.gz
          else
            API_BINARY_PATH=/tmp/api-release.gz
          fi

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$API_BINARY_PATH" \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/opt/fueld/staging/app-release.gz

      - name: Package frontend for upload
        run: |
          tar -C apps/web/dist/web/browser -czf /tmp/web-browser.tar.gz .
          ls -lh /tmp/web-browser.tar.gz

      - name: Upload frontend archive
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/web-browser.tar.gz \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/opt/fueld/staging/web-browser.tar.gz

      - name: Package drizzle migrations for upload
        run: |
          tar -C apps/api/drizzle -czf /tmp/drizzle.tar.gz .
          ls -lh /tmp/drizzle.tar.gz

      - name: Upload drizzle migrations archive
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/drizzle.tar.gz \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/opt/fueld/staging/drizzle.tar.gz

      - name: Upload deploy script
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/deploy.sh \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/opt/fueld/staging/deploy.sh

      - name: Upload build metadata
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            build-info.json \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/opt/fueld/staging/build-info.json

      - name: Execute deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "chmod +x /opt/fueld/staging/deploy.sh && bash /opt/fueld/staging/deploy.sh"

      - name: Verify deployment
        run: |
          sleep 3
          STATUS=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "curl -sf http://127.0.0.1:\$(cat /opt/fueld/active-slot | xargs -I{} sh -c 'if [ {} = blue ]; then echo 3000; else echo 3001; fi')/health | jq -r '.data.status'" 2>/dev/null || echo "failed")
          if [ "$STATUS" = "ok" ]; then
            echo "✅ Deployment verified — API health check passed"
          else
            echo "⚠️ Health check returned: $STATUS"
            exit 1
          fi

      - name: Post-deploy cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

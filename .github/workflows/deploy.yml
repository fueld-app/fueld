name: Deploy Instance

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main, staging-bootstrap]
  workflow_dispatch:
    inputs:
      instance:
        description: Deploy target instance config from deploy/instances/<instance>.env
        required: true
        default: staging
        type: string
      deploy_ref:
        description: Branch, tag, or commit SHA to deploy (optional for manual runs)
        required: false
        default: ''
        type: string

env:
  BUN_VERSION: '1.3.10'

permissions:
  contents: read
  actions: write

jobs:
  inspect-run:
    name: Inspect tested artifacts
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_deploy: ${{ steps.inspect.outputs.should_deploy }}
    steps:
      - name: Determine deploy eligibility
        id: inspect
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy Eligibility"
              echo ""
              echo "- should_deploy: true"
              echo "- reason: manual workflow_dispatch"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          artifacts_json=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")

          artifact_names=$(printf '%s' "$artifacts_json" | jq -r '.artifacts[].name')
          printf 'Artifacts for run %s:\n%s\n' "$RUN_ID" "$artifact_names"

          has_api=false
          has_web=false
          has_meta=false

          if printf '%s\n' "$artifact_names" | grep -qx 'api-release'; then
            has_api=true
          fi
          if printf '%s\n' "$artifact_names" | grep -qx 'web-browser'; then
            has_web=true
          fi
          if printf '%s\n' "$artifact_names" | grep -qx 'build-info'; then
            has_meta=true
          fi

          should_deploy=false
          if [ "$has_api" = true ] && [ "$has_web" = true ] && [ "$has_meta" = true ]; then
            should_deploy=true
          fi

          echo "should_deploy=$should_deploy" >> "$GITHUB_OUTPUT"

          {
            echo "## Deploy Eligibility"
            echo ""
            echo "- api-release: $has_api"
            echo "- web-browser: $has_web"
            echo "- build-info: $has_meta"
            echo "- should_deploy: $should_deploy"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: inspect-run
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && needs.inspect-run.outputs.should_deploy == 'true' }}
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.instance || 'staging' }}
    env:
      DEPLOY_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.deploy_ref || github.sha }}
    concurrency:
      group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.instance || 'staging' }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${DEPLOY_REF}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Setup dependencies for manual deploys
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: ./.github/actions/setup-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: '22'

      - name: Resolve target instance
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            INSTANCE="${{ github.event.inputs.instance }}"
          else
            INSTANCE="staging"
          fi

          CONFIG_FILE="deploy/instances/${INSTANCE}.env"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "Missing instance config: $CONFIG_FILE" >&2
            exit 1
          fi

          set -a
          source "$CONFIG_FILE"
          set +a

          required_vars=(INSTANCE_NAME VPS_HOST VPS_USER DOMAIN APP_DIR)
          for required_var in "${required_vars[@]}"; do
            if [ -z "${!required_var:-}" ]; then
              echo "Missing $required_var in $CONFIG_FILE" >&2
              exit 1
            fi
          done

          {
            echo "instance=$INSTANCE"
            echo "instance_name=$INSTANCE_NAME"
            echo "vps_host=$VPS_HOST"
            echo "vps_user=$VPS_USER"
            echo "domain=$DOMAIN"
            echo "app_dir=$APP_DIR"
            echo "deploy_ref=$DEPLOY_REF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Target Instance"
            echo ""
            echo "- instance: $INSTANCE"
            echo "- deploy_ref: $DEPLOY_REF"
            echo "- host: $VPS_HOST"
            echo "- domain: $DOMAIN"
            echo "- app_dir: $APP_DIR"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download API binary artifact from Tests
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v5
        with:
          name: api-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: /tmp/deploy-artifacts/api

      - name: Restore API binary artifact
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          ls -lh /tmp/deploy-artifacts/api/api-release.gz

      - name: Download web build artifact from Tests
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v5
        with:
          name: web-browser
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: /tmp/deploy-artifacts/web

      - name: Restore web build artifact
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          mkdir -p apps/web/dist/web/browser
          cp -R /tmp/deploy-artifacts/web/. apps/web/dist/web/browser/

      - name: Download build metadata artifact from Tests
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v5
        with:
          name: build-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: /tmp/deploy-artifacts/meta

      - name: Restore build metadata artifact
        if: ${{ github.event_name == 'workflow_run' }}
        run: cp /tmp/deploy-artifacts/meta/build-info.json build-info.json

      - name: Generate build metadata
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          APP_VERSION=$(cat VERSION)
          if git rev-parse HEAD >/dev/null 2>&1; then
            ACTUAL_SHA=$(git rev-parse HEAD)
          elif [ -n "${DEPLOY_REF:-}" ]; then
            ACTUAL_SHA="$DEPLOY_REF"
          else
            ACTUAL_SHA='${{ github.sha }}'
          fi
          SHORT_SHA=$(printf '%s' "$ACTUAL_SHA" | cut -c1-7)
          SOURCE_REF='${{ github.event.inputs.deploy_ref || github.ref_name }}'
          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF="$ACTUAL_SHA"
          fi
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DEPLOY_VERSION="${APP_VERSION}+deploy.${GITHUB_RUN_NUMBER}.sha.${SHORT_SHA}"
          APP_VERSION="$APP_VERSION" \
          GIT_SHA="$ACTUAL_SHA" \
          GIT_BRANCH="$SOURCE_REF" \
          BUILD_TIME="$BUILD_TIME" \
          DEPLOY_VERSION="$DEPLOY_VERSION" \
          GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER" \
          bun run build:meta

      # ─── Build API binary ─────────────────────────────────────────
      - name: Build API (standalone binary)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cd apps/api
          bun build src/index.ts --compile --minify --target=bun-linux-x64 --outfile app-release

      - name: Package API binary for upload
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          gzip -9 -c apps/api/app-release > /tmp/api-release.gz
          ls -lh apps/api/app-release /tmp/api-release.gz

      # ─── Build Frontend ────────────────────────────────────────────
      - name: Build Frontend
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          cd apps/web
          bunx ng build --configuration production

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          INSTANCE_NAME="${{ steps.target.outputs.instance_name }}"
          # Try per-instance key first, fall back to shared key
          if [ -n "${INSTANCE_NAME}" ] && [ -n "${{ secrets[format('VPS_SSH_KEY_{0}', steps.target.outputs.instance_name)] }}" ]; then
            echo "Using per-instance SSH key: VPS_SSH_KEY_${INSTANCE_NAME}"
            echo "${{ secrets[format('VPS_SSH_KEY_{0}', steps.target.outputs.instance_name)] }}" > ~/.ssh/deploy_key
          else
            echo "Using shared SSH key: VPS_SSH_KEY"
            echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ steps.target.outputs.vps_host }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create staging directory on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ steps.target.outputs.vps_user }}@${{ steps.target.outputs.vps_host }} \
            "mkdir -p '${{ steps.target.outputs.app_dir }}/staging'"

      - name: Upload API binary
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            API_BINARY_PATH=/tmp/deploy-artifacts/api/api-release.gz
          else
            API_BINARY_PATH=/tmp/api-release.gz
          fi

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "$API_BINARY_PATH" \
            ${{ steps.target.outputs.vps_user }}@${{ steps.target.outputs.vps_host }}:${{ steps.target.outputs.app_dir }}/staging/app-release.gz

      - name: Package frontend for upload
        run: |
          tar -C apps/web/dist/web/browser -czf /tmp/web-browser.tar.gz .
          ls -lh /tmp/web-browser.tar.gz

      - name: Upload frontend archive
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/web-browser.tar.gz \
            ${{ steps.target.outputs.vps_user }}@${{ steps.target.outputs.vps_host }}:${{ steps.target.outputs.app_dir }}/staging/web-browser.tar.gz

      - name: Package drizzle migrations for upload
        run: |
          tar -C apps/api/drizzle -czf /tmp/drizzle.tar.gz .
          ls -lh /tmp/drizzle.tar.gz

      - name: Upload drizzle migrations archive
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/drizzle.tar.gz \
            ${{ steps.target.outputs.vps_user }}@${{ steps.target.outputs.vps_host }}:${{ steps.target.outputs.app_dir }}/staging/drizzle.tar.gz

      - name: Upload deploy script
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/deploy.sh \
            ${{ steps.target.outputs.vps_user }}@${{ steps.target.outputs.vps_host }}:${{ steps.target.outputs.app_dir }}/staging/deploy.sh

      - name: Upload build metadata
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            build-info.json \
            ${{ steps.target.outputs.vps_user }}@${{ steps.target.outputs.vps_host }}:${{ steps.target.outputs.app_dir }}/staging/build-info.json

      - name: Execute deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ steps.target.outputs.vps_user }}@${{ steps.target.outputs.vps_host }} \
            "APP_DIR='${{ steps.target.outputs.app_dir }}'; chmod +x \"\$APP_DIR/staging/deploy.sh\" && APP_DIR=\"\$APP_DIR\" bash \"\$APP_DIR/staging/deploy.sh\""

      - name: Verify deployment
        run: |
          sleep 3
          STATUS=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ steps.target.outputs.vps_user }}@${{ steps.target.outputs.vps_host }} \
            "APP_DIR='${{ steps.target.outputs.app_dir }}'; curl -sf http://127.0.0.1:\$(cat \"\$APP_DIR/active-slot\" | xargs -I{} sh -c 'if [ {} = blue ]; then echo 3000; else echo 3001; fi')/health | jq -r '.data.status'" 2>/dev/null || echo "failed")
          if [ "$STATUS" = "ok" ]; then
            echo "✅ Deployment verified — API health check passed"
          else
            echo "⚠️ Health check returned: $STATUS"
            exit 1
          fi

      - name: Post-deploy cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

  cleanup-test-artifacts:
    name: Cleanup test artifacts
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event_name == 'workflow_run' && needs.deploy.result == 'success' }}
    steps:
      - name: Delete temporary test artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          artifacts_json=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")

          artifact_ids=$(printf '%s' "$artifacts_json" | jq -r '.artifacts[] | select(.name == "api-release" or .name == "web-browser" or .name == "build-info") | .id')

          if [ -z "$artifact_ids" ]; then
            echo "No matching artifacts found for run ${RUN_ID}; nothing to delete."
            exit 0
          fi

          for artifact_id in $artifact_ids; do
            echo "Deleting artifact ${artifact_id} from run ${RUN_ID}"
            curl -fsSL -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

          {
            echo "## Artifact Cleanup"
            echo ""
            echo "Deleted temporary test artifacts from run ${RUN_ID}."
          } >> "$GITHUB_STEP_SUMMARY"

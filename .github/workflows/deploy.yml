name: Deploy to Production

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  VPS_HOST: 139.162.157.31
  VPS_USER: deploy
  DOMAIN: riviera-marine.fueld.app
  BUN_VERSION: '1.3.8'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js (for Angular CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ─── Build API binary ─────────────────────────────────────────
      - name: Build API (standalone binary)
        run: |
          cd apps/api
          bun build src/index.ts --compile --bytecode --minify --target=bun-linux-x64 --outfile app-release

      # ─── Build Frontend ────────────────────────────────────────────
      - name: Build Frontend
        run: |
          cd apps/web
          bunx ng build --configuration production

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create staging directory on VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "mkdir -p /opt/fueld/staging/{web,drizzle}"

      - name: Upload API binary
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            apps/api/app-release \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/opt/fueld/staging/app-release

      - name: Upload frontend
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            apps/web/dist/web/browser/* \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/opt/fueld/staging/web/

      - name: Upload drizzle migrations
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            apps/api/drizzle/* \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/opt/fueld/staging/drizzle/

      - name: Upload deploy script
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/deploy.sh \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }}:/opt/fueld/staging/deploy.sh

      - name: Execute deployment
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "chmod +x /opt/fueld/staging/deploy.sh && bash /opt/fueld/staging/deploy.sh"

      - name: Verify deployment
        run: |
          sleep 3
          STATUS=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "curl -sf http://127.0.0.1:\$(cat /opt/fueld/active-slot | xargs -I{} sh -c 'if [ {} = blue ]; then echo 3000; else echo 3001; fi')/health | jq -r '.data.status'" 2>/dev/null || echo "failed")
          if [ "$STATUS" = "ok" ]; then
            echo "✅ Deployment verified — API health check passed"
          else
            echo "⚠️ Health check returned: $STATUS"
            exit 1
          fi

      - name: Post-deploy cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

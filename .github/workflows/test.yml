name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run types tests
        run: bun test packages/types/tests

  api-typecheck:
    name: API (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: cd apps/api && bun run typecheck

  api-build:
    name: API (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Build
        run: cd apps/api && bun run build

  api-mocked:
    name: API (mocked)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fueld
          POSTGRES_PASSWORD: fueld
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    env:
      TEST_DB_BASE_URL: postgres://fueld:fueld@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install

      - name: Wait for Postgres
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const sql=postgres(base + '/postgres',{max:1,connect_timeout:2}); const deadline=Date.now()+60_000; while(true){ try{ await sql.unsafe('select 1'); break; } catch(e){ if(Date.now()>deadline){ console.error('Postgres not ready:', String(e?.message ?? e)); process.exit(1);} await new Promise(r=>setTimeout(r,1000)); } } await sql.end({timeout:5}); console.log('Postgres is ready');"
      - name: Create fresh test database
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const dbName='fueld_test_mocked_' + (process.env.GITHUB_RUN_ID ?? String(Date.now())); const sql=postgres(base + '/postgres',{max:1}); try { await sql.unsafe('CREATE DATABASE ' + dbName); } finally { await sql.end({timeout:5}); } console.log(dbName);" > /tmp/dbname
          echo "TEST_DATABASE_URL=${TEST_DB_BASE_URL}/$(cat /tmp/dbname)" >> $GITHUB_ENV
      - name: Migrate
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Run tests
        run: cd apps/api && TEST_DATABASE_URL="$TEST_DATABASE_URL" bun run test:mocked

  api-db:
    name: API (db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fueld
          POSTGRES_PASSWORD: fueld
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    env:
      TEST_DB_BASE_URL: postgres://fueld:fueld@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install

      - name: Wait for Postgres
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const sql=postgres(base + '/postgres',{max:1,connect_timeout:2}); const deadline=Date.now()+60_000; while(true){ try{ await sql.unsafe('select 1'); break; } catch(e){ if(Date.now()>deadline){ console.error('Postgres not ready:', String(e?.message ?? e)); process.exit(1);} await new Promise(r=>setTimeout(r,1000)); } } await sql.end({timeout:5}); console.log('Postgres is ready');"
      - name: Create fresh test database
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const dbName='fueld_test_db_' + (process.env.GITHUB_RUN_ID ?? String(Date.now())); const sql=postgres(base + '/postgres',{max:1}); try { await sql.unsafe('CREATE DATABASE ' + dbName); } finally { await sql.end({timeout:5}); } console.log(dbName);" > /tmp/dbname
          echo "TEST_DATABASE_URL=${TEST_DB_BASE_URL}/$(cat /tmp/dbname)" >> $GITHUB_ENV
      - name: Migrate
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Run tests
        run: cd apps/api && TEST_DATABASE_URL="$TEST_DATABASE_URL" bun run test:db

  api-e2e:
    name: API (e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fueld
          POSTGRES_PASSWORD: fueld
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    env:
      TEST_DB_BASE_URL: postgres://fueld:fueld@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install

      - name: Wait for Postgres
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const sql=postgres(base + '/postgres',{max:1,connect_timeout:2}); const deadline=Date.now()+60_000; while(true){ try{ await sql.unsafe('select 1'); break; } catch(e){ if(Date.now()>deadline){ console.error('Postgres not ready:', String(e?.message ?? e)); process.exit(1);} await new Promise(r=>setTimeout(r,1000)); } } await sql.end({timeout:5}); console.log('Postgres is ready');"
      - name: Create fresh test database
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const dbName='fueld_test_e2e_' + (process.env.GITHUB_RUN_ID ?? String(Date.now())); const sql=postgres(base + '/postgres',{max:1}); try { await sql.unsafe('CREATE DATABASE ' + dbName); } finally { await sql.end({timeout:5}); } console.log(dbName);" > /tmp/dbname
          echo "TEST_DATABASE_URL=${TEST_DB_BASE_URL}/$(cat /tmp/dbname)" >> $GITHUB_ENV
      - name: Migrate
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Run tests
        run: cd apps/api && TEST_DATABASE_URL="$TEST_DATABASE_URL" bun run test:e2e

  web-unit:
    name: Web (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Run web unit tests
        run: cd apps/web && CI=true NG_CLI_ANALYTICS=false bun run test

  web-typecheck:
    name: Web (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: cd apps/web && bunx tsc --noEmit -p tsconfig.json

  web-build:
    name: Web (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Build
        run: cd apps/web && CI=true NG_CLI_ANALYTICS=false bun run build

  web-playwright:
    name: Web (playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fueld
          POSTGRES_PASSWORD: fueld
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    env:
      TEST_DB_BASE_URL: postgres://fueld:fueld@localhost:5432
      WEB_PORT: 4200
      WEB_BASE_URL: http://localhost:4200
      E2E_USER_EMAIL: e2e@fueld.local
      E2E_USER_PASSWORD: password123
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install

      - name: Wait for Postgres
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const sql=postgres(base + '/postgres',{max:1,connect_timeout:2}); const deadline=Date.now()+60_000; while(true){ try{ await sql.unsafe('select 1'); break; } catch(e){ if(Date.now()>deadline){ console.error('Postgres not ready:', String(e?.message ?? e)); process.exit(1);} await new Promise(r=>setTimeout(r,1000)); } } await sql.end({timeout:5}); console.log('Postgres is ready');"

      - name: Create fresh test database
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const dbName='fueld_test_pw_' + (process.env.GITHUB_RUN_ID ?? String(Date.now())); const sql=postgres(base + '/postgres',{max:1}); try { await sql.unsafe('CREATE DATABASE ' + dbName); } finally { await sql.end({timeout:5}); } console.log(dbName);" > /tmp/dbname
          echo "TEST_DATABASE_URL=${TEST_DB_BASE_URL}/$(cat /tmp/dbname)" >> $GITHUB_ENV

      - name: Migrate
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate

      - name: Install Playwright browsers
        run: cd apps/web && bun run pw:install

      - name: Run Playwright
        run: cd apps/web && TEST_DATABASE_URL="$TEST_DATABASE_URL" bun run test:e2e

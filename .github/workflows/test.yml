            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${{ env.BUN_VERSION }}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: cd apps/api && bun run typecheck

  api-build:
    name: API (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${{ env.BUN_VERSION }}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: bun install
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd apps/api
          echo "Starting API build at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          bun run build > /tmp/api-build.log 2>&1 &
          build_pid=$!
          started_at=$(date +%s)
          max_seconds=900

          while kill -0 "$build_pid" 2>/dev/null; do
            now=$(date +%s)
            elapsed=$((now - started_at))
            echo "API build still running... ${elapsed}s elapsed"

            if (( elapsed >= max_seconds )); then
              echo "API build exceeded ${max_seconds}s. Terminating and printing logs..."
              kill -TERM "$build_pid" 2>/dev/null || true
              sleep 5
              kill -KILL "$build_pid" 2>/dev/null || true
              echo "----- api build log (last 200 lines) -----"
              tail -n 200 /tmp/api-build.log || true
              exit 1
            fi

            sleep 30
          done

          wait "$build_pid"
          echo "API build finished at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

  api-mocked:
    name: API (mocked)
    runs-on: ubuntu-latest
    env:
      TEST_DB_BASE_URL: postgres://fueld:fueld@localhost:5432
    steps:
      - name: Start Postgres
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt: starting Postgres..."
            docker rm -f postgres 2>/dev/null || true
            docker pull postgres:17-alpine && \
            docker run -d --name postgres -p 5432:5432 \
              -e POSTGRES_USER=fueld -e POSTGRES_PASSWORD=fueld -e POSTGRES_DB=postgres \
              postgres:17-alpine && break
            echo "Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${{ env.BUN_VERSION }}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: bun install

      - name: Wait for Postgres
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const sql=postgres(base + '/postgres',{max:1,connect_timeout:2}); const deadline=Date.now()+60_000; while(true){ try{ await sql.unsafe('select 1'); break; } catch(e){ if(Date.now()>deadline){ console.error('Postgres not ready:', String(e?.message ?? e)); process.exit(1);} await new Promise(r=>setTimeout(r,1000)); } } await sql.end({timeout:5}); console.log('Postgres is ready');"
      - name: Create fresh test database
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const dbName='fueld_test_mocked_' + (process.env.GITHUB_RUN_ID ?? String(Date.now())); const sql=postgres(base + '/postgres',{max:1}); try { await sql.unsafe('CREATE DATABASE ' + dbName); } finally { await sql.end({timeout:5}); } console.log(dbName);" > /tmp/dbname
          echo "TEST_DATABASE_URL=${TEST_DB_BASE_URL}/$(cat /tmp/dbname)" >> $GITHUB_ENV
      - name: Migrate
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Run tests
        run: cd apps/api && TEST_DATABASE_URL="$TEST_DATABASE_URL" bun run test:mocked


  web-unit:
    name: Web (unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v${{ env.BUN_VERSION }}"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install
      - name: Run web unit tests
        run: cd apps/web && CI=true NG_CLI_ANALYTICS=false bun run test


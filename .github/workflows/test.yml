name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run types tests
        run: bun test packages/types/tests

  api-mocked:
    name: API (mocked)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fueld
          POSTGRES_PASSWORD: fueld
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fueld" \
          --health-interval 5s \
          --health-timeout 3s \
          --health-retries 20
    env:
      TEST_DB_BASE_URL: postgres://fueld:fueld@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create fresh test database
        run: |
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const dbName='fueld_test_mocked_' + (process.env.GITHUB_RUN_ID ?? String(Date.now())); const sql=postgres(base + '/postgres',{max:1}); try { await sql.unsafe('CREATE DATABASE ' + dbName); } finally { await sql.end({timeout:5}); } console.log(dbName);" > /tmp/dbname
          echo "TEST_DATABASE_URL=${TEST_DB_BASE_URL}/$(cat /tmp/dbname)" >> $GITHUB_ENV
      - name: Migrate
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Run tests
        run: cd apps/api && TEST_DATABASE_URL="$TEST_DATABASE_URL" bun run test:mocked

  api-db:
    name: API (db)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fueld
          POSTGRES_PASSWORD: fueld
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fueld" \
          --health-interval 5s \
          --health-timeout 3s \
          --health-retries 20
    env:
      TEST_DB_BASE_URL: postgres://fueld:fueld@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create fresh test database
        run: |
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const dbName='fueld_test_db_' + (process.env.GITHUB_RUN_ID ?? String(Date.now())); const sql=postgres(base + '/postgres',{max:1}); try { await sql.unsafe('CREATE DATABASE ' + dbName); } finally { await sql.end({timeout:5}); } console.log(dbName);" > /tmp/dbname
          echo "TEST_DATABASE_URL=${TEST_DB_BASE_URL}/$(cat /tmp/dbname)" >> $GITHUB_ENV
      - name: Migrate
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Run tests
        run: cd apps/api && TEST_DATABASE_URL="$TEST_DATABASE_URL" bun run test:db

  api-e2e:
    name: API (e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fueld
          POSTGRES_PASSWORD: fueld
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fueld" \
          --health-interval 5s \
          --health-timeout 3s \
          --health-retries 20
    env:
      TEST_DB_BASE_URL: postgres://fueld:fueld@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create fresh test database
        run: |
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const dbName='fueld_test_e2e_' + (process.env.GITHUB_RUN_ID ?? String(Date.now())); const sql=postgres(base + '/postgres',{max:1}); try { await sql.unsafe('CREATE DATABASE ' + dbName); } finally { await sql.end({timeout:5}); } console.log(dbName);" > /tmp/dbname
          echo "TEST_DATABASE_URL=${TEST_DB_BASE_URL}/$(cat /tmp/dbname)" >> $GITHUB_ENV
      - name: Migrate
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Run tests
        run: cd apps/api && TEST_DATABASE_URL="$TEST_DATABASE_URL" bun run test:e2e

  web-unit:
    name: Web (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run web unit tests
        run: cd apps/web && bun run test

  web-playwright:
    name: Web (playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fueld
          POSTGRES_PASSWORD: fueld
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fueld" \
          --health-interval 5s \
          --health-timeout 3s \
          --health-retries 20
    env:
      TEST_DB_BASE_URL: postgres://fueld:fueld@localhost:5432
      WEB_PORT: 4200
      WEB_BASE_URL: http://localhost:4200
      E2E_USER_EMAIL: e2e@fueld.local
      E2E_USER_PASSWORD: password123
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create fresh test database
        run: |
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const dbName='fueld_test_pw_' + (process.env.GITHUB_RUN_ID ?? String(Date.now())); const sql=postgres(base + '/postgres',{max:1}); try { await sql.unsafe('CREATE DATABASE ' + dbName); } finally { await sql.end({timeout:5}); } console.log(dbName);" > /tmp/dbname
          echo "TEST_DATABASE_URL=${TEST_DB_BASE_URL}/$(cat /tmp/dbname)" >> $GITHUB_ENV

      - name: Migrate
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate

      - name: Seed Playwright user
        run: TEST_DATABASE_URL="$TEST_DATABASE_URL" bun run apps/api/tests/helpers/seed-playwright.ts

      - name: Install Playwright browsers
        run: cd apps/web && bun run pw:install

      - name: Start API
        run: |
          cd apps/api
          TEST_DATABASE_URL="$TEST_DATABASE_URL" CORS_ORIGIN="http://localhost:4200" APP_URL="http://localhost:4200" PORT=3000 bun run src/index.ts &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              echo "API is up"; exit 0;
            fi
            sleep 1
          done
          echo "API failed to start"; exit 1

      - name: Start Web
        run: |
          cd apps/web
          bunx ng serve --host localhost --port 4200 --watch=false &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:4200/login > /dev/null; then
              echo "Web is up"; exit 0;
            fi
            sleep 1
          done
          echo "Web failed to start"; exit 1

      - name: Run Playwright
        run: cd apps/web && bun run test:e2e

name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.10'

jobs:
  migration-journal:
    name: Migration journal check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Verify every migration SQL file is registered in the journal
        run: |
          journal="apps/api/drizzle/meta/_journal.json"
          missing=()
          for f in apps/api/drizzle/[0-9]*.sql; do
            tag=$(basename "$f" .sql)
            if ! grep -q "\"$tag\"" "$journal"; then
              missing+=("$tag")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "ERROR: The following migrations are NOT registered in $journal:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "Add an entry to $journal for each migration before merging."
            exit 1
          fi
          echo "All migration files are registered in the journal."

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Run types tests
        run: bun test packages/types/tests

  api-typecheck:
    name: API (typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Typecheck
        run: cd apps/api && bun run typecheck

  api-build:
    name: API (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Generate build metadata
        run: |
          APP_VERSION=$(cat VERSION)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          BRANCH_NAME=${GITHUB_REF_NAME:-main}
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          DEPLOY_VERSION="${APP_VERSION}+build.${GITHUB_RUN_NUMBER}.sha.${SHORT_SHA}"
          APP_VERSION="$APP_VERSION" \
          GIT_SHA="$GITHUB_SHA" \
          GIT_BRANCH="$BRANCH_NAME" \
          BUILD_TIME="$BUILD_TIME" \
          DEPLOY_VERSION="$DEPLOY_VERSION" \
          GITHUB_RUN_NUMBER="$GITHUB_RUN_NUMBER" \
          bun run build:meta
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cd apps/api
          echo "Starting API build at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          bun run build > /tmp/api-build.log 2>&1 &
          build_pid=$!
          started_at=$(date +%s)
          max_seconds=900

          while kill -0 "$build_pid" 2>/dev/null; do
            now=$(date +%s)
            elapsed=$((now - started_at))
            echo "API build still running... ${elapsed}s elapsed"

            if (( elapsed >= max_seconds )); then
              echo "API build exceeded ${max_seconds}s. Terminating and printing logs..."
              kill -TERM "$build_pid" 2>/dev/null || true
              sleep 5
              kill -KILL "$build_pid" 2>/dev/null || true
              echo "----- api build log (last 200 lines) -----"
              tail -n 200 /tmp/api-build.log || true
              exit 1
            fi

            sleep 30
          done

          wait "$build_pid"
          echo "API build finished at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
      - name: Upload API binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-release
          path: apps/api/app-release
          if-no-files-found: error
          retention-days: 7
      - name: Upload build metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json
          if-no-files-found: error
          retention-days: 7

  api-postgres:
    name: API (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mocked
            db-suffix: mocked
            test-script: test:mocked
          - name: db
            db-suffix: db
            test-script: test:db
          - name: e2e
            db-suffix: e2e
            test-script: test:e2e
    env:
      TEST_DB_BASE_URL: postgres://fueld:fueld@localhost:5432
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fueld
          POSTGRES_PASSWORD: fueld
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fueld -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Wait for Postgres
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const sql=postgres(base + '/postgres',{max:1,connect_timeout:2}); const deadline=Date.now()+60_000; while(true){ try{ await sql.unsafe('select 1'); break; } catch(e){ if(Date.now()>deadline){ console.error('Postgres not ready:', String(e?.message ?? e)); process.exit(1);} await new Promise(r=>setTimeout(r,1000)); } } await sql.end({timeout:5}); console.log('Postgres is ready');"
      - name: Create fresh test database
        run: |
          cd apps/api
          bun -e "import postgres from 'postgres'; const base=process.env.TEST_DB_BASE_URL; const suffix=process.env.DB_SUFFIX; const runId=process.env.GITHUB_RUN_ID ?? String(Date.now()); const runAttempt=process.env.GITHUB_RUN_ATTEMPT ?? '1'; const dbName='fueld_test_' + suffix + '_' + runId + '_' + runAttempt; const sql=postgres(base + '/postgres',{max:1}); try { await sql.unsafe('CREATE DATABASE ' + dbName); } finally { await sql.end({timeout:5}); } console.log(dbName);" > /tmp/dbname
          echo "TEST_DATABASE_URL=${TEST_DB_BASE_URL}/$(cat /tmp/dbname)" >> $GITHUB_ENV
        env:
          DB_SUFFIX: ${{ matrix.db-suffix }}
      - name: Migrate
        run: cd apps/api && DATABASE_URL="$TEST_DATABASE_URL" bun run db:migrate
      - name: Run tests
        run: cd apps/api && TEST_DATABASE_URL="$TEST_DATABASE_URL" bun run ${{ matrix.test-script }}

  web-unit:
    name: Web (unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: '22'
      - name: Run web unit tests
        run: cd apps/web && CI=true NG_CLI_ANALYTICS=false bun run test

  web-typecheck:
    name: Web (typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: '22'
      - name: Typecheck
        run: cd apps/web && bunx tsc --noEmit -p tsconfig.json

  web-build:
    name: Web (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
      - name: Fallback checkout via archive download
        if: steps.checkout.outcome == 'failure'
        run: |
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" \
            -o repo.tar.gz
          tar -xzf repo.tar.gz --strip-components=1
          rm repo.tar.gz
      - name: Setup dependencies
        uses: ./.github/actions/setup-ci
        with:
          bun-version: ${{ env.BUN_VERSION }}
          node-version: '22'
      - name: Build
        run: cd apps/web && CI=true NG_CLI_ANALYTICS=false bun run build
      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-browser
          path: apps/web/dist/web/browser
          if-no-files-found: error
          retention-days: 7

  # NOTE: Web Playwright E2E is intentionally not run in CI.
  # Run locally from apps/web: `bun run pw:install && bun run test:e2e`

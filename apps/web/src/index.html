<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fueld — Bunker Trading</title>
  <base href="/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    try {
      var p = localStorage.getItem('fueld-app-theme');
      var dark;
      if (p === 'light') dark = false;
      else if (p === 'dark') dark = true;
      else if (p === 'device') dark = matchMedia('(prefers-color-scheme: dark)').matches;
      else dark = true; /* Brand Dark: dark is the brand default for new users */
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (_) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#06080d" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260908">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=20260908">
  <link rel="manifest" href="manifest.webmanifest?v=20260908">
</head>
<body>
  <app-root></app-root>
</body>
</html>

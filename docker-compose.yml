services:
  postgres:
    image: postgres:17-alpine
    container_name: fueld-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: fueld
      POSTGRES_PASSWORD: fueld
      POSTGRES_DB: fueld
    volumes:
      - fueld_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fueld']
      interval: 5s
      timeout: 3s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    container_name: fueld-searxng
    ports:
      - '8888:8080'
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
    volumes:
      - fueld_searxng:/etc/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  yente:
    image: ghcr.io/opensanctions/yente:latest
    container_name: fueld-yente
    ports:
      - '8000:8000'
    environment:
      YENTE_TITLE: 'Fueld Sanctions Screening'
      YENTE_INDEX_URL: 'https://data.opensanctions.org/datasets/latest/index.json'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/healthz']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  fueld_pgdata:
  fueld_searxng:
